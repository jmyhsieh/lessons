<p class="kicker">相容性入口 · 原第 2 階段第 04 課</p><h1>「用 MCP 連接外部工具」已收斂為受信任連線任務</h1>
<p class="identity"><strong>穩定公開網址識別：</strong><code>lessons/002-0004-mcp</code></p>
<h2>轉接原因</h2><p>原課已搬移、改名並條件化；最終課程只在目前的任務確實需要外部脈絡或動作時連接一個受信任 MCP，先界定來源、權限與副作用。</p>
<h2>證據沿用</h2><p class="carryover">若你已保存舊課的 MCP 設定與快速驗證證據，可保留為 <code>Lesson practiced</code>；只有目前任務重新確認伺服器識別、資料邊界與授權範圍後才能沿用。它不會自動成為 Route 成果或完成證明。</p>
