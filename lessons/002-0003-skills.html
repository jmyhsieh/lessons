<p class="kicker">相容性入口 · 原第 2 階段第 03 課</p><h1>「把 SOP 寫成 Skill」已移到標準化路線</h1>
<p class="identity"><strong>穩定公開網址識別：</strong><code>lessons/002-0003-skills</code></p>
<h2>轉接原因</h2><p>建立 Skill 是把已證明有效的工作流程包裝成可維護團隊指引，不只是選用既有工具；因此它已搬到標準化，並保留 裝備 的工作流程編寫邊界。</p>
<h2>證據沿用</h2><p class="carryover">若你已保存舊課的 SOP、Skill 草稿或試跑紀錄，可保留為 <code>Lesson practiced</code>；它可作為工作流程契約的輸入，但仍需依目前來源、負責人、權限與全新脈絡重跑重新驗證。它不會自動成為 Route 成果或 完成證明。</p>
