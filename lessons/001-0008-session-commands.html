<h2>轉接原因</h2><p>工作階段命令是任務中按需查閱的操作資訊，不再維持獨立課程、練習狀態或完成證明；內容已轉成標準參考資料。</p>
<h2>證據沿用</h2><p class="carryover">若你已完成舊課，可保留為 <code>Lesson practiced</code>；只有就緒檢查確認既有操作證據仍滿足目前路線停止點時，才可作為目前路線輸入。它不會自動成為路線成果或完成證明。</p>
