<p class="kicker">相容性入口 · 原 Phase 4 第 06 課</p><h1>「原型製作與驗證」已改為檢查原型假設</h1><p class="identity"><strong>穩定公開網址識別：</strong><code>lessons/004-0006-prototype-and-validate</code></p>
<h2>轉接原因</h2><p>新版把 tangible win 收斂為逐項檢查原型的響應式、互動與可及性假設，讓驗證結果可追溯，而不把「做出原型」直接當成已驗證。</p>
<h2>證據沿用</h2><p class="carry">舊課留下的原型與檢查紀錄可保留為 <code>Lesson practiced</code>；它不會自動通過目前路線停止點，仍要依新版假設與目前版本重新驗證。</p>
